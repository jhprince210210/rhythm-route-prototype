<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071018"><title>Rhythm Route</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#071018;color:#eef5f5;font-family:system-ui,-apple-system,sans-serif}body{overflow:hidden}button{font:inherit;color:inherit}.app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}header{height:56px;display:flex;align-items:center;border-bottom:1px solid #243845}h1{font-size:18px;margin:0;font-weight:950}h1 b{color:#ffbb45}.meta{margin-left:auto;text-align:right;font-size:12px;color:#9ab0ba}.meta strong{display:block;color:#fff;font-size:15px}.board{position:relative;flex:1;min-height:0}.tip{position:absolute;z-index:2;left:50%;top:8px;transform:translateX(-50%);padding:7px 10px;border:1px solid #29414f;border-radius:99px;background:#09151dcc;font-size:11px;white-space:nowrap}.beat{position:absolute;z-index:2;right:4px;top:44px;width:54px;height:54px;border:2px solid #345362;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:9px;color:#91a7b1}.beat b{font-size:21px;color:#fff;line-height:1}.beat.p{transform:scale(1.12);border-color:#ffbb45}svg{width:100%;height:100%;display:block;touch-action:none}.edge{stroke:#29434f;stroke-width:4;stroke-linecap:round}.route{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.45}.route.sel{opacity:.95}.node{fill:#10242f;stroke:#718b96;stroke-width:2}.node.next{stroke:#fff;stroke-width:4}.goal{fill:none;stroke-width:5}.agent{stroke:#071018;stroke-width:4}.panel{border-top:1px solid #243845;padding:8px 0 4px;display:grid;gap:7px}.people{display:flex;gap:6px;overflow:auto}.person{flex:none;border:1px solid #304a58;background:#0e1c25;padding:7px 10px;border-radius:10px;font-size:11px}.person.on{border-color:#fff}.person.done{background:#0d271d}.row{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:7px}.row button{border:1px solid #304a58;background:#11232d;min-height:44px;border-radius:10px;font-weight:850}.row .start{background:#ffbb45;color:#0b151b;border-color:#ffcb6e;font-weight:950}.small{display:flex;justify-content:space-between;color:#93a9b3;font-size:11px}.overlay{position:absolute;z-index:5;inset:0;background:#041019d9;display:grid;place-items:center;padding:20px}.overlay.hide{display:none}.card{width:min(360px,94vw);background:#10212b;border:1px solid #36505d;border-radius:18px;padding:20px;text-align:center}.card h2{margin:5px 0;font-size:27px}.stars{font-size:36px;color:#ffbb45}.card button{width:100%;margin-top:8px;min-height:45px;border:0;border-radius:10px;background:#ffbb45;color:#08131a;font-weight:950}.card .secondary{background:#18303c;color:#fff}.bad{color:#ff5b55}.good{color:#59d6cd}
</style></head><body><div class="app"><header><h1>RHYTHM <b>ROUTE</b></h1><div class="meta"><strong id="stageName">STAGE 1</strong><span id="stageMeta"></span></div></header><main class="board"><div class="tip" id="tip">사람을 고르고 밝은 원을 이어 목적지까지</div><div class="beat" id="beat"><div><b id="beatN">—</b><br>BEAT</div></div><svg id="svg" viewBox="0 0 360 520"></svg><div class="overlay hide" id="result"><div class="card"><div id="eye" class="good">CLEAR</div><h2 id="title">PERFECT FLOW</h2><div class="stars" id="stars">★★★</div><p id="msg"></p><button id="next">다음 스테이지</button><button class="secondary" id="retry">다시 풀기</button></div></div></main><section class="panel"><div class="people" id="people"></div><div class="small"><span>예상 <b id="plan">—</b>박</span><span>목표 <b id="par">—</b>박</span></div><div class="row"><button id="undo">↶ 한 칸</button><button id="wait">Ⅱ WAIT</button><button id="start" class="start">START ▶</button></div></section></div><script>
const NS='http://www.w3.org/2000/svg',C=['#55d5d0','#ffbd4a','#ff625a','#a582ff','#76df86'];
const P=[[35,85],[115,60],[205,80],[315,80],[65,185],[155,165],[255,170],[325,205],[35,290],[125,275],[220,275],[320,300],[70,400],[165,420],[255,405],[325,430]];
const E=[[0,1],[0,4],[1,2],[1,4],[1,5],[2,3],[2,5],[2,6],[3,6],[3,7],[4,5],[4,8],[4,9],[5,6],[5,9],[5,10],[6,7],[6,10],[6,11],[7,11],[8,9],[8,12],[9,10],[9,12],[9,13],[10,11],[10,13],[10,14],[11,14],[11,15],[12,13],[13,14],[14,15]];
const A=Array.from({length:P.length},()=>[]);E.forEach(([a,b])=>{A[a].push(b);A[b].push(a)});
const S=[
 {name:'첫 합주',bpm:104,par:5,a:[[0,10],[3,5],[12,13]],tip:'세 사람의 길을 먼저 모두 만들어보세요'},
 {name:'교차점',bpm:108,par:6,a:[[0,14],[11,5],[12,10]],tip:'같은 박자에 같은 원으로 들어가면 충돌'},
 {name:'한 박 쉬기',bpm:112,par:7,a:[[4,15],[7,8],[13,6]],tip:'필요하면 WAIT로 한 박자를 늦춰보세요'},
 {name:'엇갈림',bpm:116,par:8,a:[[0,15],[3,12],[8,7],[11,4]],tip:'개별 최단거리보다 전체 흐름이 중요합니다'}
];
let si=0,st,ag=[],sel=0,run=false,steps=[],beat=0,timer=null,audio=null;
const $=id=>document.getElementById(id),svg=$('svg');
function el(n,attrs={}){let x=document.createElementNS(NS,n);for(const[k,v]of Object.entries(attrs))x.setAttribute(k,v);return x}
function load(i){clearInterval(timer);si=i%S.length;st=S[si];ag=st.a.map((x,k)=>({s:x[0],g:x[1],r:[x[0]],c:C[k]}));sel=0;run=false;beat=0;$('stageName').textContent=`STAGE ${si+1} · ${st.name}`;$('stageMeta').textContent=`${ag.length}명 · ${st.bpm} BPM`;$('tip').textContent=st.tip;$('beatN').textContent='—';draw();ui()}
function pathD(r){return r.map((n,i)=>(i?'L':'M')+P[n][0]+' '+P[n][1]).join(' ')}
function draw(exec=null){svg.innerHTML='';E.forEach(([a,b])=>svg.append(el('line',{x1:P[a][0],y1:P[a][1],x2:P[b][0],y2:P[b][1],class:'edge'})));ag.forEach((x,i)=>{if(x.r.length>1)svg.append(el('path',{d:pathD(x.r),stroke:x.c,class:'route '+(i===sel?'sel':'')}))});let last=ag[sel].r.at(-1);P.forEach((p,i)=>{let c=el('circle',{cx:p[0],cy:p[1],r:10,class:'node '+(!run&&A[last].includes(i)?'next':'')});c.dataset.n=i;svg.append(c)});ag.forEach((x,i)=>svg.append(el('circle',{cx:P[x.g][0],cy:P[x.g][1],r:19+i*1.5,stroke:x.c,class:'goal'})));ag.forEach((x,i)=>{let p=exec?exec[i]:P[x.s];let q=el('circle',{cx:p[0],cy:p[1],r:9,fill:x.c,class:'agent'});svg.append(q)})}
function ui(){let box=$('people');box.innerHTML='';ag.forEach((x,i)=>{let b=document.createElement('button');b.className='person '+(i===sel?'on ':'')+(x.r.at(-1)===x.g?'done':'');b.innerHTML=`<b style="color:${x.c}">사람 ${i+1}</b><br>${x.s+1} → ${x.g+1}`;b.onclick=()=>{if(!run){sel=i;draw();ui()}};box.append(b)});let mx=Math.max(...ag.map(x=>x.r.length-1));$('plan').textContent=mx||'—';$('par').textContent=st.par;$('undo').disabled=run||ag[sel].r.length<2;$('wait').disabled=run;$('start').disabled=run}
svg.addEventListener('pointerdown',e=>{if(run)return;let t=e.target.closest('.node');if(!t)return;let n=+t.dataset.n,x=ag[sel],last=x.r.at(-1);if(n===last)return;if(!A[last].includes(n)){hint('밝은 원만 선택할 수 있어요');return}x.r.push(n);draw();ui()});
$('undo').onclick=()=>{if(ag[sel].r.length>1){ag[sel].r.pop();draw();ui()}};$('wait').onclick=()=>{let x=ag[sel];x.r.push(x.r.at(-1));hint('WAIT +1박');draw();ui()};
function hint(s){let old=st.tip;$('tip').textContent=s;setTimeout(()=>$('tip').textContent=old,1000)}
function beep(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=beat%4===1?700:430;g.gain.value=.045;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.06);o.stop(audio.currentTime+.07)}catch(e){}}
$('start').onclick=()=>{let bad=ag.findIndex(x=>x.r.at(-1)!==x.g);if(bad>=0){sel=bad;hint(`사람 ${bad+1} 경로를 목적지까지 완성하세요`);draw();ui();return}run=true;steps=ag.map(()=>0);beat=0;ui();tick();timer=setInterval(tick,60000/st.bpm)};
function tick(){beat++;$('beatN').textContent=beat;$('beat').classList.add('p');setTimeout(()=>$('beat').classList.remove('p'),100);beep();let prev=ag.map((x,i)=>x.r[Math.min(steps[i],x.r.length-1)]),next=ag.map((x,i)=>x.r[Math.min(steps[i]+1,x.r.length-1)]);for(let i=0;i<ag.length;i++)for(let j=i+1;j<ag.length;j++){if(next[i]===next[j]||(prev[i]===next[j]&&prev[j]===next[i]&&prev[i]!==prev[j]))return finish(false,`사람 ${i+1}과 ${j+1}이 ${beat}박째 충돌`)}steps=steps.map((s,i)=>Math.min(s+1,ag[i].r.length-1));let pos=steps.map((s,i)=>P[ag[i].r[s]]);draw(pos);if(ag.every((x,i)=>steps[i]>=x.r.length-1))setTimeout(()=>finish(true,'전원이 박자에 맞춰 도착했습니다'),170)}
function finish(ok,msg){clearInterval(timer);run=false;let mx=Math.max(...ag.map(x=>x.r.length-1)),star=ok?(mx<=st.par?3:mx<=st.par+1?2:1):0;$('eye').textContent=ok?'CLEAR':'CRASH';$('eye').className=ok?'good':'bad';$('title').textContent=ok?(star===3?'PERFECT FLOW':'CLEAR'):'충돌!';$('stars').textContent=ok?'★'.repeat(star)+'☆'.repeat(3-star):'✕';$('msg').textContent=msg;$('next').style.display=ok?'block':'none';$('result').classList.remove('hide')}
$('next').onclick=()=>{$('result').classList.add('hide');load(si+1)};$('retry').onclick=()=>{$('result').classList.add('hide');load(si)};load(0);
</script></body></html>
