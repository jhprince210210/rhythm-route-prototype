function crash(msg){if(timer){clearInterval(timer);timer=null}running=false;finishPending=false;showResult(false,msg,0)}
function finish(){if(timer){clearInterval(timer);timer=null}running=false;finishPending=false;const arrival=[...exec.arrivalBeat],finishBeat=Math.max(...arrival),sync=arrival.every(v=>v===arrival[0]);let stars=1;if(sync&&finishBeat===stage.perfectBeat)stars=3;else if(finishBeat<=stage.perfectBeat+1)stars=2;if(stars>progress.stars[stageIndex])progress.stars[stageIndex]=stars;progress.unlocked=Math.max(progress.unlocked,Math.min(STAGES.length,stageIndex+2));saveProgress();if(stars===3){perfectSound();const f=$('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}const msg=stars===3?'최소 박자에 전원이 동시에 도착했습니다.':stars===2?(sync?'동시 도착 성공! 한 박 더 줄일 수 있어요.':'거의 완벽합니다. 도착 박자를 맞춰보세요.'):'클리어! 더 짧고 아름다운 흐름이 숨어 있습니다.';showResult(true,msg,stars,arrival,finishBeat,sync)}
function showResult(ok,msg,stars=0,arrival=null,finishBeat=null,sync=false){$('resultEye').textContent=ok?'CLEAR':'CRASH';$('resultEye').className='eyebrow '+(ok?'good':'bad');$('resultTitle').textContent=ok?(stars===3?'PERFECT FLOW':'STAGE CLEAR'):'충돌!';$('resultStars').textContent=ok?'★'.repeat(stars)+'☆'.repeat(3-stars):'✕';$('resultMsg').textContent=msg;$('finishBeat').textContent=finishBeat??beatNo;$('perfectBeat').textContent=stage.perfectBeat;$('arrivalBeats').textContent=arrival?arrival.join(' · '):'—';$('syncResult').textContent=ok?(sync?'SYNC!':'NOT SYNC'):'—';$('nextBtn').style.display=ok&&stageIndex<STAGES.length-1?'block':'none';$('resultOverlay').classList.remove('hide')}
$('retryBtn').onclick=()=>{$('resultOverlay').classList.add('hide');loadStage(stageIndex)};$('nextBtn').onclick=()=>{$('resultOverlay').classList.add('hide');loadStage(Math.min(STAGES.length-1,stageIndex+1))};$('mapBtn').onclick=showMap;
buildMap();showMap();
</script>
